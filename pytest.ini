[pytest]
# Collect only tests/. Without this a bare `uv run pytest` recurses into the
# gitignored vendored micropython-microbit-v2/ checkout and dies during
# collection on upstream's own example scripts (drivers/display/lcd160cr_test.py,
# tests/qemu-arm/native_test.py): 2 errors, 0 tests run. That was true before
# this file existed; it matters more now, because fetching the unix-port
# submodules for the MicroPython semantics harness grew that tree considerably.
testpaths = tests
